# Runs the whole check (type check, build, tests, smoke test) on every pull
# request and on pushes to develop and main, so a broken test shows on the PR
# before it merges. Node 24, as Netlify builds and runs the functions with. No
# secrets needed: the API tests run against a fake database.

name: Check

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# A newer push to a PR replaces its older run. Runs for develop and main always
# finish, so every merged commit gets a result.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
