<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060b1e">
<title>Ryan Ski Jump</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="description" content="Christmas Eve at Canada Olympic Park: Ryan takes the big jump. Longest flight wins.">
<meta property="og:type" content="website">
<meta property="og:title" content="Ryan Ski Jump">
<meta property="og:description" content="Christmas Eve at Canada Olympic Park: Ryan takes the big jump. Longest flight wins.">
<meta property="og:url" content="%SITE_URL%/games/christmas-2026/">
<meta property="og:image" content="%SITE_URL%/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Inline, so the first paint is already night rather than white. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060b1e; }
  #ui { visibility: hidden; }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="ui">
  <a class="back" href="/">← Arcade</a>

  <div id="hud" hidden>
    <span id="readout"></span>
  </div>

  <p id="callout" aria-live="polite"></p>

  <div class="overlay" id="startScreen">
    <p class="kicker">🎄 Christmas Eve · Calgary 🎄</p>
    <h1>Ryan Ski Jump</h1>
    <ol class="how">
      <li><strong>Tap</strong> to push off</li>
      <li><strong>Tap</strong> again right at the lip to jump</li>
      <li><strong>Hold</strong> to glide · <strong>let go</strong> before you land</li>
    </ol>
    <button class="big" id="startBtn" type="button">Tap to start</button>
    <p class="sub" id="bestLine"></p>
  </div>

  <div class="overlay" id="resultScreen" hidden>
    <h2 id="resultTitle"></h2>
    <p class="big-number" id="resultDistance"></p>
    <p class="sub" id="resultDetail"></p>
    <button class="big" id="againBtn" type="button">Jump again</button>
  </div>

  <div class="overlay" id="noWebgl" hidden>
    <h2>This one needs 3D</h2>
    <p>Your browser can't show WebGL graphics, so the ski jump can't run here. Try it on another browser or device.</p>
  </div>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
