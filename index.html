<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Ryan Arcade</title>

<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="description" content="A little arcade of games made for Ryan — a new one every birthday, Christmas, and Easter.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Ryan Arcade">
<meta property="og:title" content="Ryan Arcade">
<meta property="og:description" content="A little arcade of games made for Ryan — a new one every birthday, Christmas, and Easter.">
<meta property="og:url" content="%SITE_URL%/">
<meta property="og:image" content="%SITE_URL%/og.png">
<meta name="twitter:card" content="summary_large_image">

<!-- The Action Furnace poster's brand typefaces, and the neon sign's 80s faces. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Mr+Dafoe&family=Oswald:wght@700&family=Poppins:wght@600;700&display=swap">

<style>
  /* Inline, so the first paint is already dark rather than white. */
  html, body { margin: 0; height: 100%; background: #07040f; }
</style>
</head>
<body>

<canvas id="arcade" aria-hidden="true"></canvas>

<nav id="cabinets" aria-label="Games">
  <h1>Ryan Arcade</h1>
  <ul id="cabinetList"></ul>
</nav>

<p id="credit">Coded by <span>Rainer B.</span></p>

<div id="controls" aria-hidden="true">
  <p class="now">
    <strong id="focusTitle"></strong>
    <span id="focusOccasion"></span>
  </p>
  <div class="buttons">
    <button id="prevBtn" type="button" tabindex="-1">◀</button>
    <button id="playBtn" type="button" tabindex="-1">PLAY</button>
    <button id="nextBtn" type="button" tabindex="-1">▶</button>
  </div>
  <p class="hint">← → to browse · Enter to play</p>
</div>

<div id="fade"></div>

<script type="module" src="/src/lobby/main.ts"></script>
</body>
</html>
