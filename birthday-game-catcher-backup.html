<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday Ryan!</title>
<style>
  :root {
    --gold:  #ffd166;
    --pink:  #ff6fa3;
    --purple:#a78bfa;
    --mint:  #4ecdc4;
    --text:  #f2ecff;
    --muted: #b9a9d6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0b0720;
  }

  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- dark night-course background ---------- */
  #stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 600px at 18% 8%,  rgba(167,139,250,.22), transparent 65%),
      radial-gradient(800px 620px at 88% 18%, rgba(255,111,163,.18), transparent 65%),
      radial-gradient(1000px 500px at 50% 108%, rgba(34,120,80,.34), transparent 70%),
      linear-gradient(168deg, #140b33 0%, #1d1046 42%, #2a1450 72%, #14092c 100%);
  }

  /* soft vignette so the edges fall away */
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(6,3,18,.55) 100%);
  }

  .decor {
    position: absolute;
    font-size: 42px;
    opacity: .16;
    pointer-events: none;
  }
  .d1 { top: 7%;   left: 7%;  transform: rotate(-12deg); }
  .d2 { top: 13%;  right: 8%; transform: rotate(10deg); font-size: 36px; }
  .d3 { bottom: 11%; left: 8%; transform: rotate(6deg);  font-size: 34px; }
  .d4 { bottom: 16%; right: 7%; transform: rotate(-8deg); font-size: 38px; }

  canvas#game {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    font-weight: 700;
    font-size: 18px;
    pointer-events: none;
  }

  #hud .pill {
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.14);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 15px;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  #lives { letter-spacing: 2px; }
  #lives .spent { opacity: .25; filter: grayscale(1); }

  #muteBtn {
    pointer-events: auto;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.14);
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: var(--text);
    background: rgba(255,255,255,.10);
    border-radius: 999px;
    padding: 8px 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  #hud.hidden { display: none; }

  /* ---------- overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 24px;
    text-align: center;
    background: rgba(10,6,28,.62);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
  }
  .overlay[hidden] { display: none; }

  .overlay h1 {
    margin: 0;
    font-size: clamp(30px, 7vw, 54px);
    line-height: 1.08;
    color: var(--gold);
    text-shadow: 0 0 26px rgba(255,209,102,.45), 0 3px 0 rgba(0,0,0,.35);
  }

  .overlay h2 {
    margin: 0;
    font-size: clamp(25px, 5.6vw, 40px);
    line-height: 1.15;
    color: var(--pink);
    text-shadow: 0 0 22px rgba(255,111,163,.35);
  }

  .overlay p {
    margin: 0;
    max-width: 30ch;
    font-size: clamp(15px, 3.6vw, 19px);
    line-height: 1.5;
    font-weight: 600;
    color: #ded3f5;
  }

  .overlay .sub {
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
  }

  button.big {
    cursor: pointer;
    border: 0;
    font: inherit;
    font-weight: 800;
    font-size: clamp(17px, 4.2vw, 21px);
    color: #23103a;
    background: linear-gradient(180deg, #ffe08a, var(--gold));
    padding: 15px 36px;
    border-radius: 999px;
    box-shadow: 0 6px 0 #c99a2e, 0 14px 30px rgba(255,209,102,.30);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  button.big:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #c99a2e, 0 6px 16px rgba(255,209,102,.26);
  }

  /* ---------- portrait (head on start / win / lose screens) ---------- */
  .portrait {
    width: 210px;
    height: auto;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,.5));
  }
  .portrait.dizzy {
    animation: wobble 1.6s ease-in-out infinite;
  }
  .portrait.party {
    animation: bounce 1.1s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-13deg); }
    50%      { transform: rotate(13deg); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .portrait.dizzy, .portrait.party { animation: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <span class="decor d1">⛳</span>
  <span class="decor d2">🎈</span>
  <span class="decor d3">🏌️</span>
  <span class="decor d4">🎈</span>

  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <span class="pill" id="score">⛳ 0 / 5</span>
    <span class="pill" id="lives">❤️❤️❤️</span>
    <button id="muteBtn" type="button" aria-label="Toggle sound">🔇</button>
  </div>

  <!-- START -->
  <div class="overlay" id="startScreen">
    <canvas class="portrait" id="startPortrait" width="420" height="476"></canvas>
    <h1>Happy Birthday<br>Ryan!</h1>
    <p>Catch 5 golf balls — dodge the water and the trees!</p>
    <button class="big" id="startBtn" type="button">Tee Off ⛳</button>
    <p class="sub" id="startHint">Arrow keys or A / D &nbsp;·&nbsp; drag on touchscreens</p>
  </div>

  <!-- WIN -->
  <div class="overlay" id="winScreen" hidden>
    <canvas class="portrait party" id="winPortrait" width="420" height="476"></canvas>
    <h1>🎉 Happy Birthday Ryan! 🎉</h1>
    <p id="winCopy">Five for five. Somebody get this man a cart. ⛳</p>
    <button class="big" id="winBtn" type="button">Play Again</button>
    <p class="sub" id="winStats"></p>
  </div>

  <!-- LOSE -->
  <div class="overlay" id="loseScreen" hidden>
    <canvas class="portrait dizzy" id="losePortrait" width="420" height="476"></canvas>
    <h2 id="loseTitle">Shanked it! ⛳💥</h2>
    <p id="loseCopy">Straight into the water. Take the drop and try again.</p>
    <button class="big" id="loseBtn" type="button">Try Again</button>
    <p class="sub" id="loseStats"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =======================================================================
     ASSETS — swap in the real photo here.
     Drop the file in assets/ and point HEAD_IMAGE_SRC at it. That's it.
     HEAD_PARTY_IMAGE_SRC is optional: leave it "" and the party hat is
     drawn on top of the normal head automatically.
     ======================================================================= */
  var HEAD_IMAGE_SRC       = "assets/ryan-head-floating.png";
  var HEAD_PARTY_IMAGE_SRC = "";

  /* The shipped cutout has transparent margins around Ryan. These are the
     bounds of the actual head inside the 300x300 PNG, as fractions, so he
     sits dead-centre and fills the frame. Set to null to use the whole image
     (do that if you swap in a differently-cropped photo). */
  var HEAD_TRIM = { x: 67 / 300, y: 21 / 300, w: 189 / 300, h: 259 / 300 };

  /* ---------- tuning ---------- */
  var BALLS_TO_WIN      = 5;
  var START_LIVES       = 3;
  var SPAWN_MIN_MS      = 470;
  var SPAWN_MAX_MS      = 740;
  var SPAWN_FLOOR_MS    = 330;    // spawn interval never tightens past this
  var WEIGHTS           = [["ball", 38], ["water", 31], ["tree", 31]];
  var BASE_FALL         = 210;    // px/sec at a 720px-tall canvas
  var HAZARD_SPEED      = 1.45;   // hazards drop harder than the balls do
  var SPEED_CAP         = 1.9;    // max difficulty multiplier
  var RAMP_EVERY_MS     = 12000;
  var RAMP_SPEED_STEP   = 1.09;
  var RAMP_SPAWN_STEP   = 0.93;
  var INVULN_MS         = 750;    // longer grace period now that hazards are dense
  var SHAKE_MS          = 200;
  var SPIN_MS           = 700;    // how long Ryan's head spins after a hit
  var KEY_SPEED         = 620;    // px/sec
  var HEAD_R            = 62;     // drawn half-width, scaled on small screens
  var HITBOX_SCALE      = 0.78;   // forgiving hitbox, matched to the head's oval
  var HAZARD_EMOJI = { water: "💧", tree: "🌳" };
  var EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
  var CONFETTI_COLORS = ["#ff6fa3", "#a78bfa", "#ffd166", "#4ecdc4", "#ff9f68", "#ffffff"];

  /* ---------- elements ---------- */
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var hud = document.getElementById("hud");
  var scoreEl = document.getElementById("score");
  var livesEl = document.getElementById("lives");
  var muteBtn = document.getElementById("muteBtn");
  var startScreen = document.getElementById("startScreen");
  var winScreen = document.getElementById("winScreen");
  var loseScreen = document.getElementById("loseScreen");
  var winStats = document.getElementById("winStats");
  var loseStats = document.getElementById("loseStats");
  var startHint = document.getElementById("startHint");

  /* ---------- head images ---------- */
  var headImg = null, partyImg = null;
  var headAspect = 1;   // drawn height / drawn width; 1 until the photo loads

  // source rectangle to pull out of the image (honours HEAD_TRIM for the main head)
  function srcRect(img, trimmed) {
    if (trimmed && HEAD_TRIM) {
      return {
        sx: HEAD_TRIM.x * img.naturalWidth,
        sy: HEAD_TRIM.y * img.naturalHeight,
        sw: HEAD_TRIM.w * img.naturalWidth,
        sh: HEAD_TRIM.h * img.naturalHeight
      };
    }
    return { sx: 0, sy: 0, sw: img.naturalWidth, sh: img.naturalHeight };
  }

  function loadImage(src, onload) {
    if (!src) return null;
    var img = new Image();
    img.onload = function () { if (img.naturalWidth) onload(img); };
    img.onerror = function () { /* placeholder stays */ };
    img.src = src;
    return img;
  }

  loadImage(HEAD_IMAGE_SRC, function (img) {
    headImg = img;
    var s = srcRect(img, true);
    headAspect = s.sh / s.sw;
    resize();               // his height changed, so his resting position does too
    redrawPortraits();
  });
  loadImage(HEAD_PARTY_IMAGE_SRC, function (img) { partyImg = img; redrawPortraits(); });

  /* ---------- storage (Chrome throws on localStorage over file://) ---------- */
  var store = {
    get: function (k, fallback) {
      try {
        var v = localStorage.getItem(k);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    },
    set: function (k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* no-op */ }
    }
  };

  /* ---------- canvas sizing ---------- */
  var W = 0, H = 0, headR = HEAD_R, scale = 1;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.max(0.62, Math.min(1.15, Math.min(W, H) / 620));
    headR = HEAD_R * scale;
    player.y = H - headR * headAspect - 26;
    clampPlayer();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });

  /* ---------- state ---------- */
  var STATE = { START: 0, PLAYING: 1, WIN: 2, LOSE: 3 };
  var state = STATE.START;

  var player = { x: 0, y: 0, targetX: null, lean: 0, spinT: 0, spinDir: 1 };
  var objects = [];
  var confetti = [];
  var floaters = [];
  var keys = { left: false, right: false };

  var balls = 0, lives = START_LIVES;
  var elapsed = 0, spawnTimer = 0, nextSpawn = 1000;
  var speedMult = 1, spawnMult = 1, rampTimer = 0;
  var invuln = 0, shake = 0;
  var frozen = false;

  function clampPlayer() {
    player.x = Math.max(headR, Math.min(W - headR, player.x));
  }

  function reset() {
    objects.length = 0;
    confetti.length = 0;
    floaters.length = 0;
    balls = 0;
    lives = START_LIVES;
    elapsed = 0;
    spawnTimer = 0;
    nextSpawn = rand(SPAWN_MIN_MS, SPAWN_MAX_MS);
    speedMult = 1;
    spawnMult = 1;
    rampTimer = 0;
    invuln = 0;
    shake = 0;
    frozen = false;
    player.x = W / 2;
    player.targetX = null;
    player.lean = 0;
    player.spinT = 0;
    clampPlayer();
    updateHud();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------- HUD ---------- */
  function updateHud() {
    scoreEl.textContent = "⛳ " + balls + " / " + BALLS_TO_WIN;
    var out = "";
    for (var i = 0; i < START_LIVES; i++) {
      out += i < lives ? "❤️" : '<span class="spent">❤️</span>';
    }
    livesEl.innerHTML = out;
  }

  /* ---------- input ---------- */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") { keys.left = true; player.targetX = null; e.preventDefault(); }
    if (k === "arrowright" || k === "d") { keys.right = true; player.targetX = null; e.preventDefault(); }
    if ((k === "enter" || k === " ") && state !== STATE.PLAYING) {
      e.preventDefault();
      startGame();
    }
  });

  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
  });

  // touch / mouse drag anywhere: the head follows the pointer's x
  var dragging = false;

  function pointerX(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches && e.touches.length) ? e.touches[0].clientX : e.clientX;
    return cx - rect.left;
  }

  function onDown(e) {
    if (state !== STATE.PLAYING) return;
    dragging = true;
    player.targetX = pointerX(e);
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging || state !== STATE.PLAYING) return;
    player.targetX = pointerX(e);
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { dragging = false; }

  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", onMove, { passive: false });
  canvas.addEventListener("touchend", onUp);
  canvas.addEventListener("touchcancel", onUp);
  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  /* ---------- sound (WebAudio, no files, off by default) ---------- */
  var audioCtx = null;
  var muted = store.get("ryanbday.muted", "1") === "1";

  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  updateMuteBtn();

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    store.set("ryanbday.muted", muted ? "1" : "0");
    updateMuteBtn();
    if (!muted) initAudio();
  });

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { audioCtx = new AC(); } catch (err) { audioCtx = null; }
  }

  function tone(freq, dur, type, when, vol) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + (when || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  var sfx = {
    // a crisp "tink" — like a ball off the club face
    catch: function () { tone(1180, 0.07, "square", 0, 0.10); tone(1760, 0.09, "triangle", 0.03, 0.12); },
    hit:   function () { tone(150, 0.20, "sawtooth", 0, 0.14); tone(96, 0.26, "sawtooth", 0.05, 0.12); },
    win:   function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, "triangle", i * 0.11); }); },
    lose:  function () { [392, 349, 294].forEach(function (f, i) { tone(f, 0.24, "sine", i * 0.13, 0.14); }); }
  };

  /* ---------- spawning ---------- */
  var totalWeight = WEIGHTS.reduce(function (s, w) { return s + w[1]; }, 0);

  function pickType() {
    var r = Math.random() * totalWeight;
    for (var i = 0; i < WEIGHTS.length; i++) {
      r -= WEIGHTS[i][1];
      if (r <= 0) return WEIGHTS[i][0];
    }
    return "ball";
  }

  function spawn() {
    var type = pickType();
    var isBall = type === "ball";
    var size = (isBall ? 30 : 44) * scale;   // ball is a drawn circle, hazards are emoji
    var r = isBall ? size * 0.5 : size * 0.38;   // hazards get a slightly generous gap
    objects.push({
      type: type,
      size: size,
      r: r,
      x: rand(r + 6, W - r - 6),
      y: -size - 10,
      vy: BASE_FALL * (H / 720) * speedMult * (isBall ? 1 : HAZARD_SPEED) * rand(0.9, 1.12),
      vx: rand(-18, 18),
      rot: rand(-0.4, 0.4),
      spin: rand(-1.6, 1.6)
    });
  }

  /* ---------- quips ---------- */
  var QUIPS_GOOD  = ["Pure!", "Striped it!", "Nice grab!", "That'll play.", "Money.", "Dialed in."];
  var QUIPS_WATER = ["Splash!", "Take the drop.", "Wet one.", "That's a penalty.", "Fore-ward, into the pond."];
  var QUIPS_TREE  = ["Timber!", "Trees are 90% air.", "Punch out.", "Found the woods.", "Not the fairway."];

  var WIN_COPY = [
    "Five for five. Somebody get this man a cart. ⛳",
    "Course record. The trees never stood a chance.",
    "That's a birthday birdie. 🐦",
    "Five balls, zero shanks. Textbook."
  ];
  var LOSE_TITLES = ["Shanked it! ⛳💥", "Into the drink! 💧", "Timber! 🌳", "That'll buff out. 😵‍💫"];
  var LOSE_COPY = [
    "Straight into the water. Take the drop and try again.",
    "The trees are undefeated today.",
    "Three hazards, three regrets. Reload.",
    "Somewhere out there is a very confused goose."
  ];

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  function addFloater(text, color) {
    floaters.push({
      text: text,
      color: color,
      x: player.x,
      y: player.y - headR * headAspect - 14 * scale,
      vy: -70 * scale,
      life: 1.15,
      maxLife: 1.15,
      size: 19 * scale
    });
  }

  /* ---------- confetti ---------- */
  function burstConfetti(n) {
    for (var i = 0; i < n; i++) {
      confetti.push({
        x: W / 2 + rand(-70, 70),
        y: H * 0.42 + rand(-40, 40),
        vx: rand(-320, 320),
        vy: rand(-620, -180),
        w: rand(7, 14) * scale,
        h: rand(10, 20) * scale,
        rot: rand(0, Math.PI * 2),
        spin: rand(-9, 9),
        color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
        life: rand(2.4, 4.2)
      });
    }
  }

  /* ---------- golf ball ---------- */
  function drawGolfBall(c, cx, cy, r, rot) {
    c.save();
    c.translate(cx, cy);
    c.rotate(rot || 0);

    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    var g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.65, "#eef1f5");
    g.addColorStop(1, "#b9c2cf");
    c.fillStyle = g;
    c.shadowColor = "rgba(255,255,255,.35)";
    c.shadowBlur = r * 0.7;
    c.fill();
    c.shadowBlur = 0;

    // dimples
    c.fillStyle = "rgba(140,152,170,.45)";
    var dimples = [
      [-0.42, -0.10], [-0.10, -0.44], [0.26, -0.28], [0.44, 0.10],
      [0.12, 0.42], [-0.26, 0.34], [0.00, 0.00], [-0.44, 0.42], [0.42, -0.46]
    ];
    for (var i = 0; i < dimples.length; i++) {
      c.beginPath();
      c.arc(dimples[i][0] * r, dimples[i][1] * r, r * 0.095, 0, Math.PI * 2);
      c.fill();
    }

    c.restore();
  }

  /* ---------- head + golf club ---------- */
  function drawClub(c, r, lean) {
    // drawn behind the head; angle reacts slightly to movement
    c.save();
    c.rotate(0.52 + (lean || 0) * 0.22);

    var shaftW = r * 0.115;
    var top = -r * 2.05;
    var bottom = r * 1.55;

    // shaft
    var g = c.createLinearGradient(-shaftW, 0, shaftW, 0);
    g.addColorStop(0, "#8a94a6");
    g.addColorStop(0.45, "#e9edf3");
    g.addColorStop(1, "#78829a");
    c.fillStyle = g;
    c.fillRect(-shaftW / 2, top, shaftW, bottom - top);

    // grip
    c.fillStyle = "#241a33";
    c.fillRect(-shaftW * 0.78, top, shaftW * 1.56, r * 0.78);
    c.fillStyle = "rgba(255,255,255,.16)";
    c.fillRect(-shaftW * 0.78, top + r * 0.30, shaftW * 1.56, r * 0.07);

    // club head (wedge), sitting at the bottom of the shaft
    c.save();
    c.translate(0, bottom);
    c.beginPath();
    c.moveTo(-r * 0.10, -r * 0.10);
    c.lineTo(-r * 0.78, r * 0.16);
    c.lineTo(-r * 0.74, r * 0.42);
    c.lineTo(r * 0.14, r * 0.30);
    c.closePath();
    var cg = c.createLinearGradient(-r * 0.78, 0, r * 0.14, r * 0.4);
    cg.addColorStop(0, "#dfe5ee");
    cg.addColorStop(1, "#9aa4b6");
    c.fillStyle = cg;
    c.fill();
    c.strokeStyle = "rgba(30,20,50,.45)";
    c.lineWidth = Math.max(1, r * 0.035);
    c.stroke();
    c.restore();

    c.restore();
  }

  function drawHead(c, cx, cy, r, opts) {
    opts = opts || {};
    var img = (opts.party && partyImg) ? partyImg : headImg;

    c.save();
    c.translate(cx, cy);
    if (opts.rotate) c.rotate(opts.rotate);

    if (opts.club !== false) drawClub(c, r, opts.lean);

    var topY = -r;   // top of the head, updated below once we know its height

    if (img) {
      // the photo is a transparent cutout — draw it as-is, no circular crop
      var s = srcRect(img, img === headImg);
      var dw = r * 2;
      var dh = dw * (s.sh / s.sw);
      topY = -dh / 2;

      c.save();
      // violet rim-glow so he separates from the dark background
      c.shadowColor = "rgba(178,152,255,.85)";
      c.shadowBlur = r * 0.42;
      c.drawImage(img, s.sx, s.sy, s.sw, s.sh, -dw / 2, topY, dw, dh);
      c.restore();
    } else {
      // placeholder until the photo is in place
      c.save();
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.shadowColor = "rgba(167,139,250,.55)";
      c.shadowBlur = r * 0.55;
      c.fillStyle = "#fff";
      c.fill();
      c.clip();
      var g = c.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, "#ffd8a8");
      g.addColorStop(1, "#ffb877");
      c.fillStyle = g;
      c.shadowBlur = 0;
      c.fillRect(-r, -r, r * 2, r * 2);
      c.font = (r * 1.15) + "px " + EMOJI_FONT;
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText("🙂", 0, r * 0.06);
      c.restore();
    }

    // party hat, drawn only when there is no dedicated party image
    if (opts.party && !partyImg) drawPartyHat(c, r, topY);

    // dizzy swirls, hovering either side of the head
    if (opts.dizzy) {
      c.font = (r * 0.5) + "px " + EMOJI_FONT;
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText("💫", -r * 0.95, topY + r * 0.42);
      c.fillText("💫", r * 0.95, topY + r * 0.58);
    }

    c.restore();
  }

  function drawPartyHat(c, r, topY) {
    // sits just inside the top of the head so it reads as "worn", not "floating"
    var baseY = topY + r * 0.30;
    var halfW = r * 0.60;
    var tipY = baseY - r * 1.15;

    c.save();
    c.rotate(-0.16);

    c.beginPath();
    c.moveTo(-halfW, baseY);
    c.lineTo(halfW, baseY);
    c.lineTo(0, tipY);
    c.closePath();
    var g = c.createLinearGradient(-halfW, baseY, halfW, tipY);
    g.addColorStop(0, "#ff6fa3");
    g.addColorStop(1, "#a78bfa");
    c.fillStyle = g;
    c.fill();

    // stripes
    c.save();
    c.clip();
    c.strokeStyle = "rgba(255,209,102,.95)";
    c.lineWidth = r * 0.10;
    for (var i = 0; i < 4; i++) {
      var y = baseY - i * r * 0.29;
      c.beginPath();
      c.moveTo(-halfW * 1.4, y);
      c.lineTo(halfW * 1.4, y - r * 0.30);
      c.stroke();
    }
    c.restore();

    // brim + pom-pom
    c.beginPath();
    c.ellipse(0, baseY, halfW * 1.03, r * 0.13, 0, 0, Math.PI * 2);
    c.fillStyle = "#ffd166";
    c.fill();

    c.beginPath();
    c.arc(0, tipY, r * 0.16, 0, Math.PI * 2);
    c.fillStyle = "#fff";
    c.fill();

    c.restore();
  }

  /* ---------- portraits on the overlay screens ---------- */
  function drawPortrait(id, opts) {
    var el = document.getElementById(id);
    if (!el) return;
    var c = el.getContext("2d");
    c.clearRect(0, 0, el.width, el.height);
    // sized and nudged down so the party hat and the club both stay in frame
    drawHead(c, el.width / 2, el.height * 0.60, el.width * 0.20, opts);
  }

  function redrawPortraits() {
    drawPortrait("startPortrait", {});
    drawPortrait("winPortrait", { party: true });
    drawPortrait("losePortrait", { dizzy: true });
  }

  /* ---------- game flow ---------- */
  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }

  function startGame() {
    initAudio();
    hide(startScreen); hide(winScreen); hide(loseScreen);
    hud.classList.remove("hidden");
    reset();
    state = STATE.PLAYING;
  }

  function bumpAttempts() {
    var n = (parseInt(store.get("ryanbday.attempts", "0"), 10) || 0) + 1;
    store.set("ryanbday.attempts", String(n));
    return n;
  }

  function endWin() {
    state = STATE.WIN;
    frozen = true;
    sfx.win();
    burstConfetti(170);
    document.getElementById("winCopy").textContent = pick(WIN_COPY);
    var secs = elapsed / 1000;
    var attempts = bumpAttempts();
    var best = parseFloat(store.get("ryanbday.best", "0")) || 0;
    var isBest = !best || secs < best;
    if (isBest) store.set("ryanbday.best", secs.toFixed(2));
    var bestShown = isBest ? secs : best;
    winStats.textContent =
      "Time: " + secs.toFixed(1) + "s" +
      (isBest ? " — new course record! 🏆" : " · Best: " + bestShown.toFixed(1) + "s") +
      " · Round #" + attempts;
    // let the confetti breathe for a beat before the text lands
    setTimeout(function () { if (state === STATE.WIN) show(winScreen); }, 450);
  }

  function endLose() {
    state = STATE.LOSE;
    frozen = true;
    sfx.lose();
    document.getElementById("loseTitle").textContent = pick(LOSE_TITLES);
    document.getElementById("loseCopy").textContent = pick(LOSE_COPY);
    var attempts = bumpAttempts();
    loseStats.textContent = "Balls caught: " + balls + " / " + BALLS_TO_WIN + " · Round #" + attempts;
    setTimeout(function () { if (state === STATE.LOSE) show(loseScreen); }, 350);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("winBtn").addEventListener("click", startGame);
  document.getElementById("loseBtn").addEventListener("click", startGame);

  /* ---------- update ---------- */
  function update(dt) {
    if (state === STATE.PLAYING) {
      var prevX = player.x;

      if (player.targetX !== null) {
        // ease toward the finger so it feels smooth, not snappy
        player.x += (player.targetX - player.x) * Math.min(1, dt * 18);
      }
      var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir !== 0) player.x += dir * KEY_SPEED * dt;
      clampPlayer();

      // club leans into the direction of travel
      var vel = (player.x - prevX) / Math.max(dt, 0.0001);
      var targetLean = Math.max(-1, Math.min(1, vel / 700));
      player.lean += (targetLean - player.lean) * Math.min(1, dt * 9);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 1000);
    if (invuln > 0) invuln = Math.max(0, invuln - dt * 1000);
    if (player.spinT > 0) player.spinT = Math.max(0, player.spinT - dt * 1000);

    // floating quips drift up and fade
    for (var f = floaters.length - 1; f >= 0; f--) {
      var fl = floaters[f];
      fl.y += fl.vy * dt;
      fl.vy *= 0.985;
      fl.life -= dt;
      if (fl.life <= 0) floaters.splice(f, 1);
    }

    // confetti keeps animating after the win
    for (var c = confetti.length - 1; c >= 0; c--) {
      var p = confetti[c];
      p.vy += 900 * dt;
      p.vx *= 0.995;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 60) confetti.splice(c, 1);
    }

    if (state !== STATE.PLAYING || frozen) return;

    elapsed += dt * 1000;

    // difficulty ramp
    rampTimer += dt * 1000;
    if (rampTimer >= RAMP_EVERY_MS) {
      rampTimer -= RAMP_EVERY_MS;
      speedMult = Math.min(SPEED_CAP, speedMult * RAMP_SPEED_STEP);
      spawnMult = Math.max(SPAWN_FLOOR_MS / SPAWN_MAX_MS, spawnMult * RAMP_SPAWN_STEP);
    }

    // spawning
    spawnTimer += dt * 1000;
    if (spawnTimer >= nextSpawn) {
      spawnTimer = 0;
      nextSpawn = Math.max(SPAWN_FLOOR_MS, rand(SPAWN_MIN_MS, SPAWN_MAX_MS) * spawnMult);
      spawn();
    }

    // objects — the head is an oval, so the hitbox is too
    var hitRX = headR * HITBOX_SCALE;
    var hitRY = headR * headAspect * HITBOX_SCALE;
    for (var i = objects.length - 1; i >= 0; i--) {
      var o = objects[i];
      o.y += o.vy * dt;
      o.x += o.vx * dt;
      o.rot += o.spin * dt;

      if (o.x < o.r) { o.x = o.r; o.vx *= -1; }
      if (o.x > W - o.r) { o.x = W - o.r; o.vx *= -1; }

      if (o.y - o.r > H + 20) { objects.splice(i, 1); continue; }

      // expand the oval by the object's radius, then test the point against it
      var nx = (o.x - player.x) / (hitRX + o.r);
      var ny = (o.y - player.y) / (hitRY + o.r);
      if (nx * nx + ny * ny <= 1) {
        if (o.type === "ball") {
          objects.splice(i, 1);
          balls++;
          sfx.catch();
          if (Math.random() < 0.5) addFloater(pick(QUIPS_GOOD), "#ffd166");
          updateHud();
          if (balls >= BALLS_TO_WIN) { endWin(); return; }
        } else if (invuln <= 0) {
          objects.splice(i, 1);
          lives--;
          invuln = INVULN_MS;
          shake = SHAKE_MS;
          player.spinT = SPIN_MS;                              // send him spinning
          player.spinDir = Math.random() < 0.5 ? -1 : 1;
          sfx.hit();
          addFloater(pick(o.type === "water" ? QUIPS_WATER : QUIPS_TREE), "#ff8fb1");
          updateHud();
          if (lives <= 0) { endLose(); return; }
        }
      }
    }
  }

  /* ---------- draw ---------- */
  function drawFairway() {
    // faint green glow along the bottom — a night course, not a bright lawn
    var bandH = Math.min(H * 0.28, 190 * scale);
    var g = ctx.createLinearGradient(0, H - bandH, 0, H);
    g.addColorStop(0, "rgba(38,120,84,0)");
    g.addColorStop(1, "rgba(46,142,96,.26)");
    ctx.fillStyle = g;
    ctx.fillRect(0, H - bandH, W, bandH);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawFairway();

    ctx.save();
    if (shake > 0) {
      var k = shake / SHAKE_MS;
      ctx.translate(rand(-9, 9) * k, rand(-7, 7) * k);
    }

    // falling objects
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < objects.length; i++) {
      var o = objects[i];
      if (o.type === "ball") {
        drawGolfBall(ctx, o.x, o.y, o.r, o.rot);
      } else {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);
        ctx.font = o.size + "px " + EMOJI_FONT;
        ctx.fillText(HAZARD_EMOJI[o.type], 0, 0);
        ctx.restore();
      }
    }

    // player
    if (state !== STATE.START) {
      var blink = invuln > 0 && Math.floor(invuln / 80) % 2 === 0;
      ctx.globalAlpha = blink ? 0.42 : 1;

      // one full rotation, eased out, so he always lands upright
      var spinRot = 0;
      if (player.spinT > 0) {
        var t = 1 - player.spinT / SPIN_MS;
        spinRot = player.spinDir * Math.PI * 2 * (1 - Math.pow(1 - t, 3));
      }

      drawHead(ctx, player.x, player.y, headR, {
        party: state === STATE.WIN,
        lean: player.lean,
        rotate: spinRot
      });
      ctx.globalAlpha = 1;
    }

    // floating quips
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var q = 0; q < floaters.length; q++) {
      var fl = floaters[q];
      var a = Math.min(1, fl.life / (fl.maxLife * 0.45));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = "800 " + fl.size + "px 'Trebuchet MS', system-ui, sans-serif";
      ctx.lineWidth = Math.max(3, fl.size * 0.28);
      ctx.strokeStyle = "rgba(12,6,30,.85)";
      ctx.strokeText(fl.text, fl.x, fl.y);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // confetti
    for (var c = 0; c < confetti.length; c++) {
      var p = confetti[c];
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  /* ---------- loop ---------- */
  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000); // clamp after tab-switches
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  resize();
  reset();
  state = STATE.START;
  redrawPortraits();
  startHint.textContent = ("ontouchstart" in window)
    ? "Drag anywhere to move Ryan"
    : "Arrow keys or A / D to move";
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
